name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      DEPLOY_HOST_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_HOST_FINGERPRINT }}
      DEPLOY_DOMAIN_ROOT: ${{ secrets.HOSTINGER_DOMAIN_ROOT }}
      DEPLOY_APP_URL: ${{ secrets.HOSTINGER_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            DEPLOY_HOST
            DEPLOY_PORT
            DEPLOY_USER
            DEPLOY_PRIVATE_KEY
            DEPLOY_HOST_FINGERPRINT
            DEPLOY_DOMAIN_ROOT
            DEPLOY_APP_URL
          )

          for variable_name in "${required_variables[@]}"; do
            normalized_value="${!variable_name:-}"
            normalized_value="${normalized_value#$'\xEF\xBB\xBF'}"
            normalized_value="${normalized_value//$'\r'/}"

            if [[ -z "$normalized_value" ]]; then
              echo "Missing required GitHub secret: ${variable_name}" >&2
              exit 1
            fi

            printf -v "$variable_name" '%s' "$normalized_value"
            export "$variable_name"

            {
              printf '%s<<__ELKM_%s__\n' "$variable_name" "$variable_name"
              printf '%s\n' "$normalized_value"
              printf '__ELKM_%s__\n' "$variable_name"
            } >> "$GITHUB_ENV"
          done

          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port." >&2; exit 1; }
          [[ "$DEPLOY_DOMAIN_ROOT" == /* ]] || { echo "Domain root must be an absolute path." >&2; exit 1; }
          [[ "$DEPLOY_APP_URL" =~ ^https://[^/]+/?$ ]] || { echo "Application URL must be an HTTPS origin." >&2; exit 1; }
          [[ "$DEPLOY_HOST_FINGERPRINT" =~ ^SHA256: ]] || { echo "Invalid SSH host fingerprint." >&2; exit 1; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, sqlite, xml, zip
          coverage: none

      - name: Install Composer dependencies for verification
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP checks and tests
        run: composer ci:check

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Build deployment artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_path="build/hostinger-release/${release_id}.tar.gz"

          bash scripts/build-hostinger-artifact.sh "$archive_path"

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "archive_checksum=$(sha256sum "$archive_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"

          ssh-keyscan -T 15 -t ed25519 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts.candidate"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.candidate" -E sha256 | awk 'NR == 1 {print $2}')"

          if [[ "$actual_fingerprint" != "$DEPLOY_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch." >&2
            echo "Expected: $DEPLOY_HOST_FINGERPRINT" >&2
            echo "Received: $actual_fingerprint" >&2
            exit 1
          fi

          mv "$HOME/.ssh/known_hosts.candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.artifact.outputs.release_id }}
          ARCHIVE_PATH: ${{ steps.artifact.outputs.archive_path }}
          ARCHIVE_CHECKSUM: ${{ steps.artifact.outputs.archive_checksum }}
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/hostinger_deploy"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp_options=(
            -i "$HOME/.ssh/hostinger_deploy"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_incoming=".elkm-deploy/incoming"
          remote_archive="${remote_incoming}/${RELEASE_ID}.tar.gz"

          ssh "${ssh_options[@]}" "$ssh_target" "mkdir -p '$remote_incoming'"
          scp "${scp_options[@]}" "$ARCHIVE_PATH" "${ssh_target}:${remote_archive}"

          printf -v remote_command 'bash -s -- %q %q %q %q %q' \
            "$remote_archive" \
            "$ARCHIVE_CHECKSUM" \
            "$RELEASE_ID" \
            "$DEPLOY_DOMAIN_ROOT" \
            "${DEPLOY_APP_URL%/}"

          ssh "${ssh_options[@]}" "$ssh_target" "$remote_command" < scripts/deploy-hostinger-release.sh

      - name: Deployment summary
        if: success()
        env:
          RELEASE_ID: ${{ steps.artifact.outputs.release_id }}
        run: |
          {
            echo '## Hostinger deployment succeeded'
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $DEPLOY_APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
